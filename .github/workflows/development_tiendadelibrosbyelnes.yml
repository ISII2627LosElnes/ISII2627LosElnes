name: Build and deploy ASP.Net Core app to Azure Web App - tiendadelibrosByElnes

on:
  push:
    branches:
      - 'ElenaNavarro-ContinuousDelivery' # Cambia esto por el nombre exacto de TU rama, NO la de development
  pull_request:
    branches:
      - 'development'
    types: # Esto dispara el workflow cuando un PR se cierra.
      - closed
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout
    
    env:
      API: ./src/AppForSEII.API/AppForSEII.API.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.API }}

      - name: Build with dotnet
        run: dotnet build ${{ env.API }} --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish ${{ env.API }} -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    # Esta línea asegura que solo se despliegue si el PR se aprueba y fusiona
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # EL PASO DE 'Login to Azure' SE HA ELIMINADO COMPLETAMENTE

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tiendadelibrosByElnes'
          # Pon aquí el nombre exacto del SECRETO que creaste en GitHub
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .